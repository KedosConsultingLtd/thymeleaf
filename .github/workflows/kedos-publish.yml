# Publishes a Kedos build of thymeleaf + thymeleaf-spring6 to GitHub Packages.
#
# Triggers (either):
#   - push a tag that is the version itself, e.g. 3.1.7.KEDOS-1; or
#   - run the workflow manually (Actions -> kedos-publish -> Run workflow) with the version. It publishes the
#     commit it runs on and, once publishing has succeeded, creates and pushes the version tag itself.
# The committed POMs keep the upstream version (e.g. 3.1.7.RELEASE) so upstream merges stay clean; the Kedos version is
# applied at build time. Upstream's own release path (central-publishing-maven-plugin, GPG signing) is never used:
# artifacts are installed locally and then pushed with deploy:deploy-file to GitHub Packages only.
#
# Consumers: see docs/kedos/publishing.md.

name: kedos-publish

on:
  push:
    tags:
      - '*.KEDOS-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Kedos version to publish, e.g. 3.1.7.KEDOS-1 (the tag is created after publishing)'
        required: true
        type: string

permissions:
  contents: write   # only used to push the version tag after a manual run
  packages: write

concurrency:
  group: kedos-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPOSITORY_URL: https://maven.pkg.github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            # Published versions are immutable: refuse to reuse a version that already has a tag
            if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
              echo "Tag $VERSION already exists: choose the next KEDOS-n version" >&2
              exit 1
            fi
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.KEDOS-[0-9]+$'; then
            echo "Version must look like 3.1.7.KEDOS-1 (got $VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Kedos version
        run: mvn -B -ntp versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Build and test (core + Spring 6 suites)
        run: >
          mvn -B -ntp install -Dgpg.skip
          -pl lib/thymeleaf,lib/thymeleaf-spring6,lib/testing/thymeleaf-testing,lib/testing/thymeleaf-testing-spring6,tests/thymeleaf-tests-core,tests/thymeleaf-tests-spring6
          -am

      - name: Test with static-run coalescing forced on
        run: >
          mvn -B -ntp test -Dgpg.skip
          -Dthymeleaf.testing.additionalDialects=org.thymeleaf.parsefilter.StaticRunCoalescingDialect
          -pl tests/thymeleaf-tests-core,tests/thymeleaf-tests-spring6

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"   # run deploy-file outside the reactor so no project configuration applies
          deploy() {
            (cd "$WORK" && mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
              -DrepositoryId=github -Durl="$REPOSITORY_URL" "$@")
          }
          ROOT="$GITHUB_WORKSPACE"
          deploy -Dfile="$ROOT/pom.xml" -DpomFile="$ROOT/pom.xml"
          deploy -Dfile="$ROOT/lib/pom.xml" -DpomFile="$ROOT/lib/pom.xml"
          for MODULE in thymeleaf thymeleaf-spring6; do
            DIR="$ROOT/lib/$MODULE"
            deploy -Dfile="$DIR/target/$MODULE-$VERSION.jar" -DpomFile="$DIR/pom.xml" \
              -Dsources="$DIR/target/$MODULE-$VERSION-sources.jar" \
              -Djavadoc="$DIR/target/$MODULE-$VERSION-javadoc.jar"
          done

      - name: Tag the published commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tags pushed with GITHUB_TOKEN do not trigger workflows, so this cannot start a second publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$GITHUB_SHA" -m "Kedos build $VERSION"
          git push origin "refs/tags/$VERSION"
